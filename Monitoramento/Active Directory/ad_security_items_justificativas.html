.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:16px;}
.sc{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;}
.sv{font-size:22px;font-weight:500;}
.sl{font-size:11px;color:var(--color-text-secondary);margin-top:2px;}

.card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:12px 14px 8px;}

.badges{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:500;white-space:nowrap;}
.bc{background:#FCEBEB;color:#791F1F;}
.ba{background:#FAEEDA;color:#633806;}
.bm{background:#EAF3DE;color:#27500A;}
.bscore{background:#E6F1FB;color:#0C447C;}
.balerta{background:#EEEDFE;color:#3C3489;}
.bver{background:var(--color-background-secondary);color:var(--color-text-secondary);font-family:var(--font-mono);}
.card-body{padding:0 14px 12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.col-label{font-size:10px;font-weight:500;color:var(--color-text-tertiary);text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px;}
.col-text{font-size:11.5px;color:var(--color-text-secondary);line-height:1.6;}
.impact-list{list-style:none;padding:0;}
.impact-list li{font-size:11.5px;color:var(--color-text-secondary);line-height:1.55;padding:2px 0 2px 12px;position:relative;}
.impact-list li::before{content:"";position:absolute;left:0;top:8px;width:5px;height:5px;border-radius:50%;background:var(--color-text-tertiary);}
.impact-list li.imp-crit::before{background:#A32D2D;}
.impact-list li.imp-high::before{background:#854F0B;}
.cat-sep{font-size:10px;font-weight:500;color:var(--color-text-secondary);letter-spacing:.5px;text-transform:uppercase;padding:10px 0 6px;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:8px;}

const pesoColor = { critico: "bc", alto: "ba", medio: "bm" };
const pesoLabel = { critico: "crítico", alto: "alto", medio: "médio" };
const tipoLabel = { score: "Conta no score", alerta: "Alerta avulso" };
const tipoColor = { score: "bscore", alerta: "balerta" };

let activeFilter = "todos";

function setFilter(f, btn) {
  activeFilter = f;
  document.querySelectorAll(".fb").forEach(b => b.classList.remove("on"));
  btn.classList.add("on");
  renderCards();
}

function renderCards() {
  const area = document.getElementById("cards-area");
  let filtered = data;
  if (activeFilter === "score") filtered = data.filter(d => d.tipo === "score");
  else if (activeFilter === "alerta") filtered = data.filter(d => d.tipo === "alerta");
  else if (activeFilter === "critico") filtered = data.filter(d => d.peso === "critico");
  else if (activeFilter === "alto") filtered = data.filter(d => d.peso === "alto");
  else if (activeFilter === "medio") filtered = data.filter(d => d.peso === "medio");

  let lastCat = "";
  let html = "";
  filtered.forEach(item => {
    if (item.cat !== lastCat) {
      lastCat = item.cat;
      html += `<div class="cat-sep">${item.cat}</div>`;
    }
    const impHtml = item.impactos.map(i =>
      `<li class="imp-${i.t === "crit" ? "crit" : "high"}">${i.v}</li>`
    ).join("");

    html += `<div class="card">
      <div class="card-head">
        <div class="card-name">${item.name}</div>
        <div class="badges">
          <span class="badge ${pesoColor[item.peso]}">${pesoLabel[item.peso]}</span>
          <span class="badge ${tipoColor[item.tipo]}">${tipoLabel[item.tipo]}</span>
          <span class="badge bver">${item.ver}</span>
        </div>
      </div>
      <div class="card-body">
        <div>
          <div class="col-label">O que é</div>
          <div class="col-text">${item.oque}</div>
        </div>
        <div>
          <div class="col-label">Impactos de não ter</div>
          <ul class="impact-list">${impHtml}</ul>
          <div class="score-note">${item.score_note}</div>
        </div>
      </div>
    </div>`;
  });

  area.innerHTML = html;

  // stats
  const score = data.filter(d => d.tipo === "score").length;
  const alerta = data.filter(d => d.tipo === "alerta").length;
  const crit = data.filter(d => d.peso === "critico").length;
  const alto = data.filter(d => d.peso === "alto").length;
  document.getElementById("stats-row").innerHTML = `
    <div class="sc"><div class="sv" style="color:#0C447C">${score}</div><div class="sl">Contam no score</div></div>
    <div class="sc"><div class="sv" style="color:#3C3489">${alerta}</div><div class="sl">Alertas avulsos</div></div>
    <div class="sc"><div class="sv" style="color:#791F1F">${crit}</div><div class="sl">Peso crítico</div></div>
    <div class="sc"><div class="sv" style="color:#633806">${alto}</div><div class="sl">Peso alto</div></div>
  `;
}

renderCards();
</script>
